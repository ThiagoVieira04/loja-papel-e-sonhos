version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: papel-e-sonhos-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papel_e_sonhos
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: papel-e-sonhos-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/papel_e_sonhos?schema=public
      JWT_SECRET: super-secret-jwt-key-papel-e-sonhos-2026
      JWT_REFRESH_SECRET: super-secret-refresh-key-papel-e-sonhos-2026
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papel-e-sonhos-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_WS_URL: http://localhost:3001

volumes:
  postgres_data:
  uploads_data:
